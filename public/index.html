<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowBoard</title><link rel="stylesheet" href="/css/style.css"><script src="/socket.io/socket.io.js" defer></script><script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js" defer></script><script src="/js/app.js" defer></script></head><body><div id="toast" class="toast"></div><div id="authView" class="auth-shell"><div class="auth-card"><div class="brand">FlowBoard</div><p>Team projects, tasks and real-time collaboration.</p><div class="tabs"><button data-auth="login" class="active">Login</button><button data-auth="register">Register</button></div><form id="authForm"><input id="name" placeholder="Full name" hidden><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="6" required><button class="primary">Continue</button></form></div></div><div id="appView" hidden><header><div class="brand">FlowBoard</div><div class="header-actions"><button id="notificationBtn">🔔 <span id="notifCount">0</span></button><span id="userLabel"></span><button id="logoutBtn" class="ghost">Logout</button></div></header><main><aside><div class="aside-head"><h2>Projects</h2><button id="newProjectBtn" class="icon">+</button></div><div id="projectsList"></div></aside><section class="workspace"><div class="workspace-head"><div><h1 id="projectTitle">Select a project</h1><p id="projectDescription" class="muted"></p></div><div id="projectActions"></div></div><div id="emptyState" class="empty">Create or select a project to start.</div><div id="board" class="board" hidden><div class="column" data-status="todo"><div class="col-head"><h3>To Do</h3><span id="count-todo">0</span></div><div class="task-list" id="todo"></div></div><div class="column" data-status="in-progress"><div class="col-head"><h3>In Progress</h3><span id="count-in-progress">0</span></div><div class="task-list" id="in-progress"></div></div><div class="column" data-status="done"><div class="col-head"><h3>Done</h3><span id="count-done">0</span></div><div class="task-list" id="done"></div></div></div></section></main></div><div id="modal" class="modal" hidden><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div></body></html>
